name: Python tests

on:
  push:
    branches:
      - main
      - feature/multi-area-cache-5s
  pull_request:
    branches:
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py upstream_client.py upstream_scheduler.py tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
